[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-planner"
version = "0.1.0"
description = "Agentic media planner: context assembly, agent loop, and evals."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "anthropic>=0.89",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["streamlit>=1.40", "watchdog>=4.0"]  # watchdog lets Streamlit notice changed modules

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
